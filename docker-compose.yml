services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gravitymon-api
    command: python main.py
    environment:
      - DATABASE_URL=/data/gravitymon.db
    env_file:
      - .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:5000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gravitymon-bot
    command: python bot.py
    environment:
      - DATABASE_URL=/data/gravitymon.db
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - api
    restart: unless-stopped
